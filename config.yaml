# LLM Council config. Starting values, to tune after the first runs.
# What each setting means: docs/data-contracts.md, section 11.
# max_rounds is not a setting. It is a constant (2) in code.

paths:
  cases: cases
  runs: runs
  prompts: prompts

# Fill in after choosing providers. Judges must use a different model from the specialists.
# load_config rejects TBD entries with the setting's name; tests use synthetic model names.
# API keys come from environment variables, never from this file.
models:
  specialist: { provider: groq, model: openai/gpt-oss-120b }
  chair:      { provider: groq, model: openai/gpt-oss-120b }
  red_team:   { provider: groq, model: openai/gpt-oss-120b }
  judge_a:    { provider: groq, model: qwen/qwen3.8-27b }
  judge_b:    { provider: groq, model: qwen/qwen3.8-27b }

temperature:            # used only if the model allows it
  specialist: 0.4
  judge: 0.0
  red_team: 0.5
  chair: 0.2

reasoning_effort:
  specialist: low
  judge: low
  red_team: low
  chair: low

budget:
  # Scope and depth: raises the ceiling on how much a run can spend overall.
  # Not usually the binding constraint; a provider's own rate limit (tokens
  # or requests per minute) is typically hit well before this is.
  max_total_tokens: 200000      # input plus output, all roles
  max_calls: 60                 # counts every attempt
  # Wall-clock patience: how long the whole run is allowed to take. Raising
  # this trades your own waiting time for a better chance of a complete run
  # on a rate-limited tier; lowering it trades that reliability for a
  # faster failure when something's genuinely wrong.
  max_seconds_total: 3600
  chair_reserve:                # only the chair can spend this
    tokens: 10000
    seconds: 60
    calls: 2
  # Scope and depth: the output cap per call, per role. Raising a role's cap
  # lets that role's answers be richer (fuller reasoning, more claims) at
  # the cost of more tokens per call and a bigger share of the per-minute
  # rate limit; lowering it is faster and cheaper but risks truncation.
  max_tokens_per_call:          # output cap per call
    specialist: 2500
    judge: 3000
    red_team: 3000
    chair: 3500

retries:
  max_repair_retries_per_turn: 1   # shared by bad JSON and bad citations
  max_api_attempts: 2              # the first try plus 1 retry
  # Wall-clock patience: the fallback wait before an API retry, used only
  # when the provider's own error doesn't supply a Retry-After value. Longer
  # waits are gentler on a rate-limited tier; shorter waits fail faster.
  api_retry_wait_seconds: 2

retrieval:
  top_k: 5
  # Case sections whose text is added to every specialist's search query.
  case_sections: [CASE-diagnoses, CASE-comorbidities, CASE-tests, CASE-procedure, CASE-consultant-review]

grounding:
  quote_words_min: 4
  quote_words_max: 40

judging:
  disagreement_gap: 2
  feedback_max_notes: 5
  feedback_max_words: 40

# One entry per specialist. Keywords are the fixed part of each role's search query (ours to tune).
roles:
  SURG:
    name: Lead Surgeon
    kb: kb/surgeon
    persona_prompt: persona_surg.md
    keywords: [operative risk, surgical feasibility, expected outcome, mortality, technique]
  PHYS:
    name: Specialist Physician
    kb: kb/physician
    persona_prompt: persona_phys.md
    keywords: [disease trajectory, medical management, non-surgical alternative, guideline]
  ANAES:
    name: Anaesthesia and Critical Care
    kb: kb/anaesthesia
    persona_prompt: persona_anaes.md
    keywords: [anaesthetic risk, ASA class, fitness, comorbidity, ICU recovery, peri-operative]
  ADMIN:
    name: Hospital Administration and Ethics
    kb: kb/admin
    persona_prompt: persona_admin.md
    keywords: [consent, protocol, resource availability, ethics, capacity, institutional guideline]
  RED:
    name: Red Team
    kb: kb/redteam
    keywords: [missing information, assumption, contradiction, overconfidence, injection]

privacy:
  synthetic_marker: "Synthetic case for a demonstration"
  approved_providers: [groq]

injection_scoring:
  weights:
    instruction_override: 40
    answer_manipulation: 35
    role_spoofing: 30
    hidden_text: 20
  threshold:
    default: 30
    chair: 50
