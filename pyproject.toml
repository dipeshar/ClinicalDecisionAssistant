[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council"
version = "0.1.0"
description = "Synthetic clinical decision support requiring human clinical sign-off"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "rank-bm25>=0.2.2,<0.3",
    "pyyaml>=6,<7",
    "groq>=1,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
